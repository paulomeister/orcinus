services:
  postgres:
    image: postgres:15-alpine
    container_name: orcinus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orcinus
      POSTGRES_PASSWORD: orcinus
      POSTGRES_DB: orcinus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orcinus -d orcinus"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orcinus-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://orcinus:orcinus@postgres:5432/orcinus?schema=public
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    # migrate deploy applies committed migrations (idempotent); db seed runs prisma/seed.ts
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && npx tsx watch src/index.ts"

  # frontend:
  #   Descomentar cuando exista la app Vite
  #   build:
  #     context: ./frontend
  #   ports:
  #     - "5173:5173"
  #   depends_on:
  #     - backend

volumes:
  postgres_data: